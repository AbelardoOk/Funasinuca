# docker-compose.yml
name: funasinuca

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - funasinuca_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev_user -d db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: funasinuca-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '5555:5555'
    env_file:
      - ./.env
    networks:
      - funasinuca_net
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "bunx prisma generate &&
             bunx prisma migrate deploy &&
             bunx prisma db seed &&
             bun run src/index.ts"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: funasinuca-frontend
    restart: unless-stopped
    ports:
      - '3001:3000'
    env_file:
      - ./.env
    networks:
      - funasinuca_net
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  funasinuca_net:
    driver: bridge
