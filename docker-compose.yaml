# docker-compose.yml
name: funasinuca

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - funasinuca_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev_user -d db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    restart: unless-stopped
    ports:
      - '${BACKEND_PORT}:3000'
      - '5555:5555'
    env_file:
      - ./.env
    networks:
      - funasinuca_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun --eval "fetch(\"http://localhost:${BACKEND_PORT}/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "bunx prisma generate &&
             bunx prisma migrate deploy &&
             bunx prisma db seed &&
             bun run --watch src/index.ts"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      network: host
    container_name: web
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT}:3000'
    volumes:
      - ./web:/app
      - /app/.next
      - /app/node_modules
    env_file:
      - ./.env
    networks:
      - funasinuca_net
    depends_on:
      - backend

  #desktop:
  #  build:
  #    context: ./desktop
  #    dockerfile: dockerfile
  #    network: host
  #  container_name: desktop
  #  restart: unless-stopped
  #  dns:
  #    - 8.8.8.8
  #    - 1.1.1.1
  #  ports:
  #    - '${DESKTOP_PORT}:1420'
  #  env_file:
  #    - ./.env
  #  volumes:
  #    - .:/app
  #    - /app/node_modules
  #  networks:
  #    - funasinuca_net
  #  depends_on:
  #    backend:
  #      condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:

networks:
  funasinuca_net:
    driver: bridge
